name: Verify Workshop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test public Workshop source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Enforce shell coverage thresholds
        run: npm run test:coverage

      - name: Typecheck and prove the production bundle budget
        run: |
          npm run typecheck
          npm run build

      - name: Verify public-source boundaries
        run: npm run public:check

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:e2e --workspace @marketing-builds/desktop
